<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Setup 2FA — Destr Connect</title>
  <style>
    :root {
      --bg: #0b1220; --card: #111827; --text: #f8fafc; --muted: #94a3b8;
      --blue: #3390ec; --line: #1e293b; --err: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      max-width: 420px; margin: 0 auto; padding: 24px 20px;
      min-height: 100vh;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .muted { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .card {
      background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    #qr { display: flex; justify-content: center; padding: 12px; background: #fff; border-radius: 12px; }
    .secret {
      word-break: break-all; font-family: ui-monospace, monospace; font-size: 13px;
      margin-top: 12px; color: var(--muted);
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line);
      background: #0f172a; color: var(--text); padding: 0 12px; font-size: 18px;
      letter-spacing: 0.3em; text-align: center;
    }
    .btn {
      width: 100%; height: 48px; border: none; border-radius: 14px; margin-top: 14px;
      background: var(--blue); color: #fff; font-weight: 600; font-size: 15px;
    }
    .err { color: var(--err); font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Привязка Authenticator</h1>
  <p class="muted">Отсканируйте QR в Google Authenticator / Authy, затем введите 6‑значный код.</p>
  <div class="card">
    <div id="qr">Загрузка…</div>
    <div class="secret" id="secret"></div>
  </div>
  <label>Код из приложения</label>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" />
  <button class="btn" id="btn" type="button">Подтвердить</button>
  <div class="err" id="err"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const setupToken = params.get('token') || '';
    if (!setupToken) {
      document.body.innerHTML = '<p style="padding:24px">Откройте /setup?token=ADMIN_SETUP_TOKEN</p>';
    }

    let ready = false;
    async function load() {
      const r = await fetch('/api/auth-admin?action=setup_info&token=' + encodeURIComponent(setupToken));
      const data = await r.json();
      if (!data.ok) {
        document.getElementById('qr').textContent = data.error || 'Ошибка';
        return;
      }
      document.getElementById('secret').textContent = 'Секрет: ' + data.secret;
      const canvas = document.createElement('canvas');
      document.getElementById('qr').innerHTML = '';
      document.getElementById('qr').appendChild(canvas);
      await QRCode.toCanvas(canvas, data.otpauth, { width: 220, margin: 2 });
      ready = true;
    }

    document.getElementById('btn').onclick = async () => {
      if (!ready) return;
      const code = document.getElementById('code').value.replace(/\D/g, '');
      document.getElementById('err').textContent = '';
      const r = await fetch('/api/auth-admin?action=setup_confirm', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ setupToken, code })
      });
      const data = await r.json();
      if (!data.ok) {
        document.getElementById('err').textContent = data.error || 'Ошибка';
        return;
      }
      location.href = '/admin';
    };

    load().catch((e) => {
      document.getElementById('qr').textContent = e.message;
    });
  </script>
</body>
</html>
